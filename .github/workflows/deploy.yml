name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cleanup before deployment
        run: |
          git reset --hard HEAD
          git clean -fd

      - name: Pull and set permissions
        run: |
          git pull origin main

          chmod +x start_prod.sh
          chmod +x django/hosting/django_bash_command.sh

          sudo chown -R 50000:0 ./airflow/logs
          chmod -R 755 ./airflow/logs


      - name: Run deployment script
        run: |

          ./start_prod.sh
