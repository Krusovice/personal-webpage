name: Deploy Frontend (Docker) to Raspberry Pi

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and launch frontend
        run: |
          PROJECT=website
          docker compose -f dc_frontend.yml down || true
          docker compose -f dc_frontend.yml build --pull
          docker compose -f dc_frontend.yml up -d

      - name: Build and launch backend
          PROJECT=website
          docker compose -f dc_backend.yml down || true
          docker compose -f dc_backend.yml build --pull
          docker compose -f dc_backend.yml up -d

      - name: Show status
        run: |
          docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
          echo "Frontend: http://$(hostname -I | awk '{print $1}')/"
          echo "Backend:  http://$(hostname -I | awk '{print $1}'):5000/"
