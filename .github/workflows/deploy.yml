name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cleanup before deployment
        run: |
          git reset --hard HEAD
          git clean -fd

      - name: Run deployment script
        run: |
          git pull origin main
          chmod +x start_prod.sh
          ./start_prod.sh
