name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run deployment script
        run: |
          echo "✅ Successfully connected to Raspberry Pi!"
          cd ${{ secrets.PI_TARGET_PATH }}
          git pull origin main
          echo "✅ Successfully pulled main!"
          chmod +x start_prod.sh
          ./start_prod.sh
          echo "✅ Successfully initiated start_prod.sh!"
