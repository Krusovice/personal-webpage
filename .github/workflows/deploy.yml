name: Deploy Website (Docker) to Raspberry Pi

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & launch stack
        env:
          ENV_FILE: /home/jmk/secrets-and-database/webpage.env.prod
        run: |
          docker compose --env-file "$ENV_FILE" down --remove-orphans || true
          docker compose --env-file "$ENV_FILE" up -d --build --wait


      - name: Show status
        run: |
          docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
          IP=$(hostname -I | awk '{print $1}')
          echo "Frontend: http://$IP/"
          echo "Backend:  http://$IP:5000/"
