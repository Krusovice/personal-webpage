name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cleanup before deployment
        run: |
          git reset --hard HEAD
          git clean -fd

      - name: Prepare Nginx
        run: |
          sudo rm -rf ./nginx/cache
          
          mkdir -p ./nginx/cache/client_temp
          sudo chown -R $HOST_UID:0 ./nginx/cache
          sudo chmod -R 755 ./nginx/cache

          mkdir -p ./nginx/run
          sudo chown -R 1000:0 ./nginx/run
          sudo chmod -R 755 ./nginx/run


      - name: Preparing Airflow
        run: |
          echo "" >> .env
          echo "AIRFLOW_UID=$(id -u)" >> .env

      - name: Preparing Django
        run: |
          chmod +x django/hosting/django_bash_command.sh

      - name: Run deployment script
        run: |
          chmod +x start_prod.sh
          ./start_prod.sh

      - name: Permissions after deployment
        run: |
          sudo chown -R $USER:$USER /home/user/actions-runner/_work

