name: Deploy Frontend (Docker) to Raspberry Pi

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optional: ensure docker/compose are installed on the runner
      # - name: Install Docker Compose plugin (if needed)
      #   run: |
      #     if ! docker compose version >/dev/null 2>&1; then
      #       sudo apt-get update
      #       sudo apt-get install -y docker-compose-plugin
      #     fi

      - name: Build and launch frontend
        run: |
          docker compose -f dc_frontend.yml down || true
          docker compose -f dc_frontend.yml build --pull
          docker compose -f dc_frontend.yml up -d

      - name: Show status
        run: |
          docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
          echo "Open: http://$(hostname -I | awk '{print $1}')/"
