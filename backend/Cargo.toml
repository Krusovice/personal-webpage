[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.6"
axum-extra = { version = "0.12.1", features = ["cookie"] }
tokio = { version = "1.48.0", features = ["full"] }
anyhow = "1.0.100"
reqwest = "0.12.24"
serde = "1.0.228"
serde_json = "1.0.145"
tower-http = { version = "0.6.6", features = ["cors"] }
argon2 = "0.5.3"
rand = "0.9.2"
time = "0.3.44"

# DB
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "macros", "uuid", "chrono"] }
dotenvy = "0.15" # if you want to load .env locally
chrono = { version = "0.4", features = ["serde"] }