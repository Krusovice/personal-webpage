services:
  airflow-webserver:
    container_name: airflow_webserver
    image: apache/airflow:2.10.5
    user: "${HOST_UID}:${HOST_GID}"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow_db
      - AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS=False
      - AIRFLOW_CONN_WEBPAGE_POSTGRES_DB=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/webpage_db
    command: [ "bash", "-c", "pip install -r /requirements.txt && exec airflow webserver" ]
    env_file:
    - .env
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/requirements.txt:/requirements.txt

    depends_on:
      airflow-init:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - webpage_network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

  airflow-scheduler:
    container_name: airflow_scheduler
    image: apache/airflow:2.10.5
    user: "${HOST_UID}:${HOST_GID}"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow_db
      - AIRFLOW_CONN_WEBPAGE_POSTGRES_DB=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/webpage_db
    command: [ "bash", "-c", "pip install -r /requirements.txt && exec airflow scheduler" ]
    env_file:
    - .env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/requirements.txt:/requirements.txt
      - ./inputs:/inputs
    depends_on:
      airflow-init:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - webpage_network

  airflow-cli:
    container_name: airflow_cli
    image: apache/airflow:2.10.5
    user: "${HOST_UID}:${HOST_GID}"
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow_db
      - AIRFLOW_CONN_WEBPAGE_POSTGRES_DB=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/webpage_db
    command: ["bash"]
    env_file:
    - .env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/requirements.txt:/requirements.txt
    depends_on:
      airflow-init:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - webpage_network

  airflow-init:
    container_name: airflow_init
    image: apache/airflow:2.10.5
    user: "${HOST_UID}:${HOST_GID}"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init && \
        airflow users create \
          --username airflow \
          --firstname Air \
          --lastname Flow \
          --role Admin \
          --email airflow@example.com \
          --password airflow || echo "User already exists"
    env_file:
    - .env
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow_db
    restart: on-failure
    networks:
      - webpage_network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  webpage_network:
    external: true