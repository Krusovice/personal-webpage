name: webpage
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}"
      RUST_LOG: "info"
    depends_on:
      - postgres
    networks:
      - ${WEBPAGE_NETWORK}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  webpage_network:
    name: ${WEBPAGE_NETWORK}
    external: true