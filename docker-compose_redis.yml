services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - shared_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  kafka_network:
    driver: bridge
  shared_network:
    driver: bridge

volumes:
  postgres_data:
