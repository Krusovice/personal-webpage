{% extends 'base.html' %}

{% block content %}

<div class="container box">
    <a href="{% url 'literature:literature-index' %}">Go back</a>
</div>

<div class="container box">
    <table class="table">
        <tbody>
            <tr>
                <th>Author</th>
                <td>{{ item.author }}</td>
            </tr>
            <tr>
                <th>Title</th>
                <td>{{ item.title }}</td>
            </tr>
            <tr>
                <th>Tags</th>
                <td>{{ item.description }}</td>
            </tr>
            <tr>
                <th>Date Added</th>
                <td>{{ item.date_added }}</td>
            </tr>
            <tr>
                <th>Action</th>
                <td>
                    <a href="{{ item.content.url }}">Show</a> or 
                    <a href="{{ item.content.url }}" download>Download</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>

{% endblock content %}
