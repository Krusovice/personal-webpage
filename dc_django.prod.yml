services:
  django:
    environment:
      - DJANGO_ENV=production
    volumes:
      - ./django:/django
      - ./utils:/utils
      - ../../../../secrets-and-database/secrets/webpage_secrets.py:/utils/webpage_secrets.py
      - ../../../../secrets-and-database/media:/media

  nginx:
    volumes:
      - ../../../../secrets-and-database/media:/django/media
      - ./django/staticfiles:/django/staticfiles
      - ./django/hosting/nginx_production.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt/:/etc/letsencrypt
      - ./nginx/cache:/var/cache/nginx
      - ./nginx/run:/var/run