services:
  airflow-webserver:
    container_name: airflow_webserver
    image: apache/airflow:2.10.5
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://Krusovice:fedefrede@postgres/airflow_db
      - AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS=False
      - AIRFLOW_CONN_POSTGRES_DEFAULT=postgresql+psycopg2://Krusovice:fedefrede@postgres/webpage_db
    command: [ "bash", "-c", "pip install -r /requirements.txt && exec airflow webserver" ]
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/requirements.txt:/requirements.txt
    depends_on:
      - airflow-init
    restart: always
    networks:
      - webpage_network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

  airflow-scheduler:
    container_name: airflow_scheduler
    image: apache/airflow:2.10.5
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://Krusovice:fedefrede@postgres/airflow_db
    command: [ "bash", "-c", "pip install -r /requirements.txt && exec airflow scheduler" ]
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/requirements.txt:/requirements.txt
    depends_on:
      - airflow-init
    restart: always
    networks:
      - webpage_network

  airflow-cli:
    container_name: airflow_cli
    image: apache/airflow:2.10.5
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://Krusovice:fedefrede@postgres/airflow_db
    command: ["bash"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/requirements.txt:/requirements.txt
    depends_on:
      - airflow-init
    networks:
      - webpage_network

  airflow-init:
    container_name: airflow_init
    image: apache/airflow:2.10.5
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate && \
        airflow users create \
          --username airflow \
          --firstname Air \
          --lastname Flow \
          --role Admin \
          --email airflow@example.com \
          --password airflow || echo "User already exists" && \
        airflow connections get webpage_postgres_db > /dev/null 2>&1 || \
        airflow connections add webpage_postgres_db \
          --conn-uri postgresql+psycopg2://Krusovice:fedefrede@postgres/webpage_db
    environment:
      - AIRFLOW_CONN_WEBPAGE_POSTGRES_DB=postgresql+psycopg2://Krusovice:fedefrede@postgres:5432/webpage_db
    restart: on-failure
    networks:
      - webpage_network

networks:
  webpage_network:
    external: true